name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lamarck
          POSTGRES_PASSWORD: lamarck
          POSTGRES_DB: lamarck_doc_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamarck -d lamarck_doc_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lamarck:lamarck@localhost:5432/lamarck_doc_intelligence?schema=public

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema do Prisma
        run: npm run prisma:validate

      - name: Gerar client do Prisma
        run: npm run prisma:generate

      - name: Aplicar migrations
        run: npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Testes e2e
        run: npm run test:e2e
