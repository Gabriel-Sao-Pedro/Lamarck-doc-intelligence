services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lamarck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lamarck}
      POSTGRES_DB: ${POSTGRES_DB:-lamarck_doc_intelligence}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lamarck} -d ${POSTGRES_DB:-lamarck_doc_intelligence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
